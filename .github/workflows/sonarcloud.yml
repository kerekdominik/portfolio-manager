name: SonarCloud - backend

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-backend/**'
      - '.github/workflows/sonarcloud.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'portfolio-backend/**'
      - '.github/workflows/sonarcloud.yml'
  workflow_dispatch:

jobs:
  backend:
    name: Backend analysis
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
          cache-dependency-path: |
            portfolio-backend/**/*.gradle*
            portfolio-backend/gradle/wrapper/gradle-wrapper.properties
            portfolio-backend/gradle/libs.versions.toml

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: portfolio-backend
        run: ./gradlew build jacocoTestReport sonar
