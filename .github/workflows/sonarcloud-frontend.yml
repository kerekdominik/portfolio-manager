name: SonarCloud - frontend

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-frontend/**'
      - '.github/workflows/sonarcloud-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'portfolio-frontend/**'
      - '.github/workflows/sonarcloud-frontend.yml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: portfolio-frontend

      # Project key, organization, sources and exclusions live in portfolio-frontend/sonar-project.properties
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: portfolio-frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
