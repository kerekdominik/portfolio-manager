spring.application.name=portfolio-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio-manager
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true

# Spring security
jwt.secret.key=${JWT_SECRET_KEY}

#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
#spring.security.oauth2.client.registration.github.scope=email,profile

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Deployment settings (see AppProperties). The frontend normally shares the origin with the API through the nginx proxy.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Behind a reverse proxy: trust X-Forwarded-* so redirects and OAuth callback URLs use the public host and scheme
server.forward-headers-strategy=framework

# Health endpoint for container healthchecks (only "health" is exposed, without details)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Alpha Vantage (stock prices). Leave unset to skip stock list import and price lookups.
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:}

# Log levels
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG