[versions]
springframework-boot = "4.0.6"
spring-dependency-management = "1.1.7"
sonarqube = "7.3.0.8198"

springdoc-openapi-starter-webmvc-ui = "3.0.3"
jjwt-api="0.13.0"
jjwt-impl="0.13.0"
jjwt-jackson="0.13.0"
mapstruct = "1.6.3"
caffeine = "3.2.4"

[libraries]
# BOM dependencies
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springframework-boot"}

# Other dependencies
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi-starter-webmvc-ui" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt-api" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt-impl" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt-jackson" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

[plugins]
springframework-boot = { id = "org.springframework.boot", version.ref = "springframework-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
