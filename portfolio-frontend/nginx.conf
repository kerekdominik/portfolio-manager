# Serves the Angular app and forwards the API to the backend container, so browser and API share one origin
# (no CORS, no absolute API URL in the bundle).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS. Resolving at request time keeps nginx working when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Tell the backend which host and scheme the browser used (server.forward-headers-strategy=framework);
    # the locations below inherit these headers.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
    }

    # Google sign-in (not enabled yet, but the handler and callback paths must reach the backend)
    location /oauth2/authorization/ {
        proxy_pass $backend;
    }

    location /login/oauth2/ {
        proxy_pass $backend;
    }

    # Single page app: unknown paths (e.g. /dashboard, /oauth2/redirect) are handled by the Angular router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
